name: Web CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build web client
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js.
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies.
        run: pnpm install --frozen-lockfile

      - name: Test and build.
        run: pnpm build

      - name: Package.
        id: package
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version="$(sed -n 's/^VITE_VERSION=//p' .env | head -n 1)"
          test -n "$version"
          asset="tweb-${version}-${GITHUB_SHA::8}.tar.gz"
          tar -czf "artifacts/$asset" -C dist .
          (cd artifacts && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          echo "client_version=$version" >> "$GITHUB_OUTPUT"
          ls -lh artifacts

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: tweb-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish release.
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_VERSION: ${{ steps.package.outputs.client_version }}
        run: |
          set -euo pipefail
          tag="tweb-${CLIENT_VERSION}-${GITHUB_SHA::8}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Telegram Web ${CLIENT_VERSION} (build ${GITHUB_SHA::8})" \
              --notes "Official client version ${CLIENT_VERSION}; automated build of ${GITHUB_SHA}." \
              --latest
          fi
